[project]
name = "collector-parser-demo"
version = "0.1.0"
description = "Cloud-to-cloud collector/parser demo: REST + XML sources, YAML-driven mapping to a normalized model"
authors = [
    { name = "Ivan Prytula", email = "ivanprytula87@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "requests-ratelimiter>=0.7",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=collectors --cov=parsers --cov-report=term-missing --cov-report=html"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[project.scripts]
collector-parser = "cli:app"
